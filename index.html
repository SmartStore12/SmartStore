<h3>Upload Bukti Pembayaran (Otomatis ke WhatsApp + Email)</h3>
<form action="https://formsubmit.co/fathirj32@gmail.com" method="POST" enctype="multipart/form-data" onsubmit="return handleUpload()">
  <!-- Setting FormSubmit -->
  <input type="hidden" name="_captcha" value="false">
  <input type="hidden" name="_subject" value="Bukti Pembayaran dari Pelanggan 🚀">
  <input type="hidden" name="_template" value="table">
  <input type="hidden" name="_autoresponse" value="Terima kasih sudah melakukan pembayaran. Admin akan segera memverifikasi.">
  <input type="hidden" name="_next" id="next-link" value="#">

  <!-- Input Upload -->
  <input type="file" name="attachment" id="fileInput" accept="image/*,.pdf" required><br><br>

  <!-- Tombol Upload -->
  <button type="submit" class="download-btn">📤 Upload & Kirim Bukti TF</button>
</form>
